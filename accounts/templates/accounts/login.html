{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'accounts/base.css' %}">
<link rel="stylesheet" href="{% static 'accounts/components.css' %}">
<link rel="stylesheet" href="{% static 'accounts/pages.css' %}">
<title>Masuk - TooList</title>
</head>
<body data-page="login">
<main>
  <div class="auth card">
    <div class="mascot"><div class="mascot-body" id="mascot"></div></div>
    <h1>TooList</h1>
    <p class="sub">Selesaikan tugas, kumpulkan XP.</p>

    <form class="auth-form" method="post">
      {% csrf_token %}
      <label>Username</label>
      <input type="text" name="username" autocomplete="username">
      <label>Sandi</label>
      <input type="password" name="password" autocomplete="current-password">
      <button class="btn" type="submit">Login</button>
    </form>

    <a href="{% url 'register' %}">Belum punya akun? Daftar</a>
  </div>
</main>
<script src="{% static 'accounts/common.js' %}"></script>
</body>
</html>
