{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'accounts/base.css' %}">
<link rel="stylesheet" href="{% static 'accounts/components.css' %}">
<link rel="stylesheet" href="{% static 'accounts/pages.css' %}">
<title>Daftar - Taskie</title>
</head>
<body data-page="register">
<main>
  <div class="auth card">
    <div class="mascot"><div class="mascot-body" id="mascot"></div></div>
    <h1>Buat akun</h1>
    <p class="sub">Mulai petualangan produktifmu.</p>

    <form id="register-form">
      <label>Username</label>
      <input type="text" name="username" required maxlength="20" autocomplete="username">
      <label>Sandi</label>
      <input type="password" name="password" required autocomplete="new-password">
      <label>Ulangi sandi</label>
      <input type="password" name="password2" required autocomplete="new-password">
      <button class="btn">Daftar</button>
    </form>

    <a href="{% url 'login' %}">Sudah punya akun? Masuk</a>
  </div>
</main>
<script src="{% static 'accounts/common.js' %}"></script>
<script src="{% static 'accounts/auth.js' %}"></script>
</body>
</html>
